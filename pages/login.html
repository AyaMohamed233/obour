<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Luxury Bags</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-brand" style="display:flex; align-items:center;"><img src="../logo.png" alt="Luxury Bags Logo" style="height: 65px; margin-top: 15px; margin-right: -15px; margin-left: -10px; transform: scale(1.5); transform-origin: center;"> LUXURY BAGS</a>
            <ul class="navbar-nav">
                <li><a href="../index.html" class="navbar-link">Home</a></li>
                <li><a href="products.html" class="navbar-link">Shop</a></li>
                <li><a href="sale.html" class="navbar-link">Sale</a></li>
                <li><a href="contact.html" class="navbar-link">Contact</a></li>
            </ul>
            <div class="navbar-actions">
                <a href="cart.html" class="navbar-icon"><i class="fas fa-shopping-bag"></i></a>
            </div>
        </div>
    </nav>

    <!-- Auth Section -->
    <section class="auth-section">
        <div class="auth-container">
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="signup">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Login to access your account</p>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="login-email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-password">
                        <input type="password" class="form-input" id="login-password" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('login-password')">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group flex justify-between items-center">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me">
                        <span>Remember me</span>
                    </label>
                    <a href="forgot-password.html" class="text-accent" style="font-size: var(--text-sm);">Forgot
                        password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-full">Login</button>

                <div class="auth-divider">
                    <span>or continue with</span>
                </div>

                <button type="button" class="btn btn-secondary btn-lg w-full" id="google-login">
                    <i class="fab fa-google"></i> Google
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form">
                <h2 class="auth-title">Create Account</h2>
                <p class="auth-subtitle">Join us for exclusive offers</p>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" id="signup-username" placeholder="johndoe" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" id="signup-fullname" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="signup-email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="tel" class="form-input" id="signup-phone" placeholder="+20 123 456 7890" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Governorate</label>
                    <select class="form-input" id="signup-governorate" required>
                        <option value="">Select governorate</option>
                        <option value="Cairo">Cairo</option>
                        <option value="Alexandria">Alexandria</option>
                        <option value="Giza">Giza</option>
                        <option value="Sharm El Sheikh">Sharm El Sheikh</option>
                        <option value="Hurghada">Hurghada</option>
                        <option value="Luxor">Luxor</option>
                        <option value="Aswan">Aswan</option>
                        <option value="Port Said">Port Said</option>
                        <option value="Suez">Suez</option>
                        <option value="Mansoura">Mansoura</option>
                        <option value="Tanta">Tanta</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-password">
                        <input type="password" class="form-input" id="signup-password" placeholder="••••••••" required
                            minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword('signup-password')">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="agree-terms" required>
                        <span>I agree to the <a href="terms.html" class="text-accent">Terms & Conditions</a></span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-full">Create Account</button>

                <div class="auth-divider">
                    <span>or continue with</span>
                </div>

                <button type="button" class="btn btn-secondary btn-lg w-full" id="google-signup">
                    <i class="fab fa-google"></i> Google
                </button>
            </form>
        </div>
    </section>

    <div id="toast-container" class="toast-container"></div>

    <script src="../js/supabase-config.js"></script>
    <script>
        // Tab switching
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(`${tab.dataset.tab}-form`).classList.add('active');
            });
        });

        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Login form
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                await Auth.signIn(email, password);
                Utils.showToast('Login successful!', 'success');
                setTimeout(() => window.location.href = '../index.html', 1000);
            } catch (error) {
                Utils.showToast(error.message || 'Login failed', 'error');
            }
        });

        // Signup form
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const metadata = {
                username: document.getElementById('signup-username').value,
                full_name: document.getElementById('signup-fullname').value,
                phone: document.getElementById('signup-phone').value,
                government: document.getElementById('signup-governorate').value
            };
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            try {
                await Auth.signUp(email, password, metadata);
                Utils.showToast('Account created! Please check your email to verify.', 'success');
            } catch (error) {
                Utils.showToast(error.message || 'Signup failed', 'error');
            }
        });

        // Google login
        document.getElementById('google-login').addEventListener('click', () => Auth.signInWithGoogle());
        document.getElementById('google-signup').addEventListener('click', () => Auth.signInWithGoogle());

        // Check if already logged in
        Auth.getUser().then(user => {
            if (user) window.location.href = 'account.html';
        });
    </script>

    <style>
        .auth-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(72px + var(--space-8)) var(--space-4) var(--space-8);
            background: var(--gradient-surface);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            box-shadow: var(--shadow-xl);
        }

        .auth-tabs {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-8);
            background: var(--color-bg);
            padding: var(--space-1);
            border-radius: var(--radius-md);
        }

        .auth-tab {
            flex: 1;
            padding: var(--space-3);
            font-family: var(--font-primary);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--color-text-muted);
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .auth-tab.active {
            color: var(--color-bg);
            background: var(--color-accent);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn var(--transition-normal) ease-out;
        }

        .auth-title {
            font-size: var(--text-2xl);
            margin-bottom: var(--space-2);
            text-align: center;
        }

        .auth-subtitle {
            color: var(--color-text-muted);
            text-align: center;
            margin-bottom: var(--space-6);
        }

        .input-password {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: var(--space-4);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--text-sm);
            color: var(--color-text-muted);
            cursor: pointer;
        }

        .checkbox-label input {
            accent-color: var(--color-accent);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin: var(--space-6) 0;
            color: var(--color-text-muted);
            font-size: var(--text-sm);
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }
    </style>
</body>

</html>
