<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Luxury Bags</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.stripe.com/v3/"></script>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-brand" style="display:flex; align-items:center;"><img src="../logo.png" alt="Luxury Bags Logo" style="height: 65px; margin-top: 15px; margin-right: -15px; margin-left: -10px; transform: scale(1.5); transform-origin: center;"> LUXURY BAGS</a>
            <div class="navbar-actions">
                <a href="cart.html" class="navbar-icon"><i class="fas fa-arrow-left"></i> Back to Cart</a>
            </div>
        </div>
    </nav>

    <section style="padding: calc(72px + 3rem) 0 4rem; min-height: 100vh;">
        <div class="container" style="max-width: 1000px;">
            <h1 style="font-size: 2rem; margin-bottom: 2rem;">Checkout</h1>

            <form id="checkout-form" style="display: grid; grid-template-columns: 1fr 380px; gap: 2rem;">
                <!-- Left Column -->
                <div>
                    <!-- Shipping Address -->
                    <div
                        style="background: var(--color-surface); padding: 1.5rem; border-radius: 1rem; margin-bottom: 1.5rem;">
                        <h3 style="margin-bottom: 1rem;">Shipping Address</h3>
                        <div id="addresses-list"></div>
                        <div id="new-address-form" style="display: none;">
                            <div class="form-group"><label class="form-label">Full Name</label><input type="text"
                                    class="form-input" id="addr-name"></div>
                            <div class="form-group"><label class="form-label">Phone</label><input type="tel"
                                    class="form-input" id="addr-phone"></div>
                            <div class="form-group"><label class="form-label">Governorate</label>
                                <select class="form-input" id="addr-gov">
                                    <option value="">Select</option>
                                    <option value="Cairo">Cairo</option>
                                    <option value="Alexandria">Alexandria</option>
                                    <option value="Giza">Giza</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group"><label class="form-label">City</label><input type="text"
                                    class="form-input" id="addr-city"></div>
                            <div class="form-group"><label class="form-label">Address</label><textarea
                                    class="form-input" id="addr-line" rows="2"></textarea></div>
                        </div>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="toggleAddressForm()"
                            id="add-address-btn">+ Add New Address</button>
                    </div>

                    <!-- Payment Method -->
                    <div
                        style="background: var(--color-surface); padding: 1.5rem; border-radius: 1rem; margin-bottom: 1.5rem;">
                        <h3 style="margin-bottom: 1rem;">Payment Method</h3>
                        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                            <label
                                style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: var(--color-bg); border-radius: 0.5rem; cursor: pointer;">
                                <input type="radio" name="payment" value="cod" checked> <i
                                    class="fas fa-money-bill-wave"></i> Cash on Delivery
                            </label>
                            <label
                                style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: var(--color-bg); border-radius: 0.5rem; cursor: pointer;">
                                <input type="radio" name="payment" value="card"> <i class="fas fa-credit-card"></i>
                                Credit/Debit Card (Visa, Mastercard, Meeza)
                            </label>
                            <label
                                style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: var(--color-bg); border-radius: 0.5rem; cursor: pointer;">
                                <input type="radio" name="payment" value="wallet"> <i class="fas fa-mobile-alt"></i>
                                Mobile Wallet (Vodafone Cash, Orange, Etisalat)
                            </label>
                        </div>
                        <div id="wallet-input" style="display: none; margin-top: 1rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem;">Wallet Phone
                                Number</label>
                            <input type="tel" id="wallet-phone" class="form-input" placeholder="01XXXXXXXXX"
                                pattern="01[0-9]{9}">
                            <small style="color: var(--color-text-muted);">Enter your mobile wallet number</small>
                        </div>
                    </div>

                    <!-- Notes -->
                    <div style="background: var(--color-surface); padding: 1.5rem; border-radius: 1rem;">
                        <h3 style="margin-bottom: 1rem;">Order Notes (Optional)</h3>
                        <textarea class="form-input" id="order-notes" rows="3"
                            placeholder="Special delivery instructions..."></textarea>
                    </div>
                </div>

                <!-- Right Column - Order Summary -->
                <div
                    style="background: var(--color-surface); padding: 1.5rem; border-radius: 1rem; height: fit-content; position: sticky; top: 100px;">
                    <h3 style="margin-bottom: 1rem;">Order Summary</h3>
                    <div id="order-items"></div>
                    <div style="border-top: 1px solid var(--glass-border); padding-top: 1rem; margin-top: 1rem;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span>Subtotal</span><span id="subtotal">0</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span>Shipping</span><span id="shipping">0</span>
                        </div>
                        <div
                            style="display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 700; color: var(--color-accent); padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                            <span>Total</span><span id="total">0</span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-full" style="margin-top: 1.5rem;"
                        id="place-order-btn">Place Order</button>
                </div>
            </form>
        </div>
    </section>

    <script src="../js/supabase-config.js"></script>
    <script>
        let cart = [], addresses = [], selectedAddressId = null;
        const PAYMOB_IFRAME_ID = '986998';
        const EDGE_FUNCTION_URL = 'https://wtxrezufftbrvgjwxmqe.supabase.co/functions/v1/paymob-checkout';
        const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0eHJlenVmZnRicnZnand4bXFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NDQ2OTIsImV4cCI6MjA5ODMyMDY5Mn0.H_mqVZD47APcme1Yc72Tnn0IqC2m3aMyUGJGbOWaq-g';
        const EDGE_HEADERS = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON}`,
            'apikey': SUPABASE_ANON
        };

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const user = await Auth.getUser();
                if (!user) { window.location.href = 'login.html'; return; }

                await Promise.all([loadCart(), loadAddresses()]);
                setupPaymentToggle();
            } catch (error) {
                console.error('Failed to load checkout:', error);
                Utils.showToast('Failed to load checkout data', 'error');
            }
        });

        async function loadCart() {
            cart = await API.getCart();
            if (!cart.length) { window.location.href = 'cart.html'; return; }

            const subtotal = cart.reduce((s, i) => s + i.line_total, 0);
            const shipping = 0; // Free shipping

            document.getElementById('order-items').innerHTML = cart.map(i => `
                <div style="display: flex; gap: 0.75rem; margin-bottom: 0.75rem;">
                    <img src="${i.product_image || 'https://via.placeholder.com/50'}" style="width: 50px; height: 50px; border-radius: 0.25rem; object-fit: cover;">
                    <div style="flex: 1;"><p style="font-size: 0.875rem;">${i.product_name}</p><p style="font-size: 0.75rem; color: var(--color-text-muted);">x${i.quantity}</p></div>
                    <span>${Utils.formatPrice(i.line_total)}</span>
                </div>
            `).join('');

            document.getElementById('subtotal').textContent = Utils.formatPrice(subtotal);
            document.getElementById('shipping').innerHTML = '<span style="color:var(--color-success);">FREE</span>';
            document.getElementById('total').textContent = Utils.formatPrice(subtotal);
        }

        async function loadAddresses() {
            addresses = await API.getAddresses();
            const container = document.getElementById('addresses-list');

            if (addresses.length) {
                selectedAddressId = addresses[0].id;
                container.innerHTML = addresses.map(a => `
                    <label style="display: flex; align-items: flex-start; gap: 0.75rem; padding: 1rem; background: var(--color-bg); border-radius: 0.5rem; margin-bottom: 0.5rem; cursor: pointer;">
                        <input type="radio" name="address" value="${a.id}" ${a.is_default ? 'checked' : ''} onchange="selectedAddressId='${a.id}'">
                        <div><strong>${a.recipient_name}</strong><br><span style="font-size: 0.875rem; color: var(--color-text-muted);">${a.street_address}, ${a.city}, ${a.governorate}</span></div>
                    </label>
                `).join('');
            } else {
                document.getElementById('new-address-form').style.display = 'block';
                document.getElementById('add-address-btn').style.display = 'none';
            }
        }

        function toggleAddressForm() {
            const form = document.getElementById('new-address-form');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        function setupPaymentToggle() {
            document.querySelectorAll('input[name="payment"]').forEach(r => {
                r.addEventListener('change', (e) => {
                    const walletInput = document.getElementById('wallet-input');
                    walletInput.style.display = e.target.value === 'wallet' ? 'block' : 'none';
                });
            });
        }

        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('place-order-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            try {
                // Check if new address needs to be saved
                if (!selectedAddressId) {
                    const newAddr = await API.addAddress({
                        recipient_name: document.getElementById('addr-name').value,
                        phone: document.getElementById('addr-phone').value,
                        governorate: document.getElementById('addr-gov').value,
                        city: document.getElementById('addr-city').value,
                        street_address: document.getElementById('addr-line').value,
                        is_default: true
                    });
                    selectedAddressId = newAddr.id;
                }

                const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
                const notes = document.getElementById('order-notes').value;

                // Calculate total (Free shipping)
                const subtotal = cart.reduce((s, i) => s + i.line_total, 0);
                const total = subtotal; // Free shipping

                // Create order first
                const orderId = await API.createOrder(selectedAddressId, paymentMethod, null, null, notes);

                // Handle payment based on method
                if (paymentMethod === 'cod') {
                    await API.clearCart();
                    Utils.showToast('Order placed successfully!', 'success');
                    setTimeout(() => window.location.href = `order-success.html?id=${orderId}`, 1500);
                }
                else if (paymentMethod === 'card' || paymentMethod === 'wallet') {
                    // Paymob payment flow
                    await processPaymobPayment(orderId, total, paymentMethod);
                }

            } catch (error) {
                Utils.showToast(error.message || 'Failed to place order', 'error');
                btn.disabled = false;
                btn.textContent = 'Place Order';
            }
        });

        async function processPaymobPayment(orderId, amount, method) {
            try {
                const profile = await API.getProfile();
                const address = addresses.find(a => a.id === selectedAddressId);

                // Step 1: Get auth token
                const authRes = await fetch(EDGE_FUNCTION_URL, {
                    method: 'POST',
                    headers: EDGE_HEADERS,
                    body: JSON.stringify({ action: 'auth' })
                });
                const authData = await authRes.json();
                console.log('Paymob Auth Response:', JSON.stringify(authData, null, 2));
                if (!authData.token) {
                    const errorMsg = authData.error || authData.details?.message || JSON.stringify(authData);
                    console.error('Paymob Auth Error Details:', errorMsg);
                    alert('Paymob Error: ' + errorMsg);
                    throw new Error(errorMsg);
                }
                const token = authData.token;

                // Step 2: Create order
                const orderRes = await fetch(EDGE_FUNCTION_URL, {
                    method: 'POST',
                    headers: EDGE_HEADERS,
                    body: JSON.stringify({
                        action: 'create_order',
                        token,
                        amount,
                        orderId
                    })
                });
                const { order_id: paymobOrderId } = await orderRes.json();

                // Step 3: Get payment key
                const paymentRes = await fetch(EDGE_FUNCTION_URL, {
                    method: 'POST',
                    headers: EDGE_HEADERS,
                    body: JSON.stringify({
                        action: 'payment_key',
                        token,
                        paymobOrderId,
                        amount,
                        paymentMethod: method,
                        billingData: {
                            firstName: profile?.full_name?.split(' ')[0] || 'Customer',
                            lastName: profile?.full_name?.split(' ')[1] || 'Name',
                            email: profile?.email || 'customer@email.com',
                            phone: address?.phone || '01000000000',
                            city: address?.city || 'Cairo',
                            governorate: address?.governorate || 'Cairo',
                            street: address?.street_address || 'N/A'
                        }
                    })
                });
                const { payment_key } = await paymentRes.json();

                // Step 4: Redirect to payment page
                if (method === 'card') {
                    // Redirect to Paymob iframe for card payment
                    window.location.href = `https://accept.paymob.com/api/acceptance/iframes/${PAYMOB_IFRAME_ID}?payment_token=${payment_key}`;
                } else if (method === 'wallet') {
                    // Wallet payment - send to user's phone
                    const walletPhone = document.getElementById('wallet-phone').value;
                    if (!walletPhone || !/^01[0-9]{9}$/.test(walletPhone)) {
                        throw new Error('Please enter a valid Egyptian phone number');
                    }

                    const walletRes = await fetch(EDGE_FUNCTION_URL, {
                        method: 'POST',
                        headers: EDGE_HEADERS,
                        body: JSON.stringify({
                            action: 'wallet_pay',
                            paymentKey: payment_key,
                            phoneNumber: walletPhone
                        })
                    });
                    const walletData = await walletRes.json();

                    if (walletData.redirect_url) {
                        window.location.href = walletData.redirect_url;
                    } else {
                        Utils.showToast('Check your phone for wallet payment confirmation', 'success');
                        setTimeout(() => window.location.href = `order-success.html?id=${orderId}`, 3000);
                    }
                }

            } catch (error) {
                console.error('Paymob Error:', error);
                throw error;
            }
        }
    </script>
</body>

</html>
