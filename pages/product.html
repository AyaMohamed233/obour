<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | Luxury Bags</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-brand">LUXURY BAGS</a>
            <ul class="navbar-nav">
                <li><a href="../index.html" class="navbar-link">Home</a></li>
                <li><a href="products.html" class="navbar-link active">Shop</a></li>
                <li><a href="sale.html" class="navbar-link">Sale</a></li>
                <li><a href="contact.html" class="navbar-link">Contact</a></li>
            </ul>
            <div class="navbar-actions">
                <a href="wishlist.html" class="navbar-icon"><i class="far fa-heart"></i></a>
                <a href="cart.html" class="navbar-icon"><i class="fas fa-shopping-bag"></i><span
                        class="navbar-icon-badge hidden" id="cart-count">0</span></a>
                <a href="login.html" class="navbar-icon" id="account-icon"><i class="far fa-user"></i></a>
            </div>
        </div>
    </nav>

    <!-- Product Detail -->
    <section class="product-detail-section">
        <div class="container">
            <nav class="breadcrumb mb-8">
                <a href="../index.html">Home</a>
                <span>/</span>
                <a href="products.html">Shop</a>
                <span>/</span>
                <span id="breadcrumb-name">Loading...</span>
            </nav>

            <div class="product-detail" id="product-detail">
                <!-- Loading skeleton -->
                <div class="product-gallery">
                    <div class="skeleton" style="aspect-ratio: 1; border-radius: var(--radius-lg);"></div>
                </div>
                <div class="product-info">
                    <div class="skeleton" style="height: 40px; width: 80%; margin-bottom: var(--space-4);"></div>
                    <div class="skeleton" style="height: 24px; width: 40%; margin-bottom: var(--space-6);"></div>
                    <div class="skeleton" style="height: 100px; margin-bottom: var(--space-6);"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="toast-container" class="toast-container"></div>

    <script src="../js/supabase-config.js"></script>
    <script>
        let product = null;
        let selectedColor = null;
        let quantity = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            if (!slug) {
                window.location.href = 'products.html';
                return;
            }

            await loadProduct(slug);
        });

        async function loadProduct(slug) {
            try {
                product = await API.getProductBySlug(slug);

                if (!product) {
                    document.getElementById('product-detail').innerHTML = `
                        <div class="text-center" style="grid-column: 1/-1; padding: var(--space-12);">
                            <h2>Product Not Found</h2>
                            <p class="text-muted">The product you're looking for doesn't exist.</p>
                            <a href="products.html" class="btn btn-primary mt-4">Back to Shop</a>
                        </div>
                    `;
                    return;
                }

                document.title = `${product.name} | Luxury Bags`;
                document.getElementById('breadcrumb-name').textContent = product.name;

                // Track view
                API.trackProductView(product.id).catch(() => { });

                renderProduct();
            } catch (error) {
                console.error('Failed to load product:', error);
            }
        }

        function renderProduct() {
            const container = document.getElementById('product-detail');
            const images = product.images || [];
            const primaryImage = Utils.getPrimaryImage(images);
            const colors = product.colors || [];

            // Select first available color
            selectedColor = colors.find(c => (c.quantity - c.reserved_quantity) > 0) || colors[0];
            const maxStock = selectedColor ? (selectedColor.quantity - selectedColor.reserved_quantity) : 0;
            const isOutOfStock = maxStock <= 0;

            container.innerHTML = `
                <div class="product-gallery">
                    <div class="main-image">
                        <img src="${primaryImage}" alt="${product.name}" id="main-image">
                    </div>
                    ${images.length > 1 ? `
                        <div class="thumbnail-grid">
                            ${images.map((img, i) => `
                                <button class="thumbnail ${i === 0 ? 'active' : ''}" onclick="changeImage('${img.image_url}', this)">
                                    <img src="${img.image_url}" alt="${img.alt_text || product.name}">
                                </button>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>

                <div class="product-info">
                    ${product.brand ? `<a href="products.html?brand=${product.brand.slug}" class="product-brand">${product.brand.name}</a>` : ''}
                    <h1 class="product-title">${product.name}</h1>
                    
                    <div class="product-rating">
                        ${renderStars(product.avg_rating || 0)}
                        <span class="rating-text">${product.avg_rating || 0} (${product.review_count || 0} reviews)</span>
                    </div>

                    <div class="product-price">
                        <span class="current-price">${Utils.formatPrice(product.price)}</span>
                        ${product.compare_at_price ? `<span class="original-price">${Utils.formatPrice(product.compare_at_price)}</span>` : ''}
                    </div>

                    <p class="product-description">${product.short_description || product.description || 'No description available.'}</p>

                    ${colors.length > 0 ? `
                        <div class="product-option">
                            <label>Color: <strong id="selected-color-name">${selectedColor?.color_name || 'N/A'}</strong></label>
                            <div class="color-options">
                                ${colors.map(color => `
                                    <button class="color-btn ${color.id === selectedColor?.id ? 'active' : ''}" 
                                        data-color-id="${color.id}"
                                        data-stock="${color.quantity - color.reserved_quantity}"
                                        style="background-color: ${color.color_hex || '#888'}"
                                        onclick="selectColor('${color.id}')"
                                        title="${color.color_name}">
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="product-option">
                        <label>Quantity:</label>
                        <div class="quantity-selector">
                            <button class="qty-btn" onclick="changeQty(-1)" ${quantity <= 1 ? 'disabled' : ''}>−</button>
                            <input type="number" class="qty-input" value="${quantity}" min="1" max="${maxStock}" id="qty-input" onchange="updateQty(this.value)">
                            <button class="qty-btn" onclick="changeQty(1)" ${quantity >= maxStock ? 'disabled' : ''}>+</button>
                        </div>
                        <span class="stock-info ${isOutOfStock ? 'out' : maxStock <= 5 ? 'low' : ''}">
                            ${isOutOfStock ? 'Out of Stock' : maxStock <= 5 ? `Only ${maxStock} left` : `${maxStock} in stock`}
                        </span>
                    </div>

                    <div class="product-actions">
                        <button class="btn btn-primary btn-lg" id="add-to-cart" onclick="addToCart()" ${isOutOfStock ? 'disabled' : ''}>
                            <i class="fas fa-shopping-bag"></i> Add to Cart
                        </button>
                        <button class="btn btn-secondary btn-lg btn-icon" onclick="addToWishlist()">
                            <i class="far fa-heart"></i>
                        </button>
                    </div>

                    ${product.sku ? `<p class="product-meta">SKU: ${product.sku}</p>` : ''}
                    ${product.category ? `<p class="product-meta">Category: <a href="products.html?category=${product.category.slug}">${product.category.name}</a></p>` : ''}
                </div>
            `;

            // Load attributes/specs if available
            if (product.attributes && product.attributes.length > 0) {
                container.innerHTML += `
                    <div class="product-specs" style="grid-column: 1/-1; margin-top: var(--space-8);">
                        <h3>Specifications</h3>
                        <table class="specs-table">
                            ${product.attributes.map(attr => `
                                <tr>
                                    <td>${attr.attribute_name}</td>
                                    <td>${attr.attribute_value}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                `;
            }
        }

        function renderStars(rating) {
            const full = Math.floor(rating);
            const half = rating % 1 >= 0.5 ? 1 : 0;
            const empty = 5 - full - half;
            return `
                ${'<i class="fas fa-star"></i>'.repeat(full)}
                ${half ? '<i class="fas fa-star-half-alt"></i>' : ''}
                ${'<i class="far fa-star"></i>'.repeat(empty)}
            `;
        }

        function changeImage(url, btn) {
            document.getElementById('main-image').src = url;
            document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        }

        function selectColor(colorId) {
            const colors = product.colors || [];
            selectedColor = colors.find(c => c.id === colorId);

            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-color-id="${colorId}"]`).classList.add('active');
            document.getElementById('selected-color-name').textContent = selectedColor?.color_name || 'N/A';

            // Update stock info
            const maxStock = selectedColor ? (selectedColor.quantity - selectedColor.reserved_quantity) : 0;
            const stockInfo = document.querySelector('.stock-info');
            stockInfo.className = `stock-info ${maxStock <= 0 ? 'out' : maxStock <= 5 ? 'low' : ''}`;
            stockInfo.textContent = maxStock <= 0 ? 'Out of Stock' : maxStock <= 5 ? `Only ${maxStock} left` : `${maxStock} in stock`;

            // Update add to cart button
            document.getElementById('add-to-cart').disabled = maxStock <= 0;

            // Reset quantity if needed
            if (quantity > maxStock) {
                quantity = Math.max(1, maxStock);
                document.getElementById('qty-input').value = quantity;
            }
            document.getElementById('qty-input').max = maxStock;
        }

        function changeQty(delta) {
            const maxStock = selectedColor ? (selectedColor.quantity - selectedColor.reserved_quantity) : 1;
            quantity = Math.max(1, Math.min(maxStock, quantity + delta));
            document.getElementById('qty-input').value = quantity;
        }

        function updateQty(val) {
            const maxStock = selectedColor ? (selectedColor.quantity - selectedColor.reserved_quantity) : 1;
            quantity = Math.max(1, Math.min(maxStock, parseInt(val) || 1));
            document.getElementById('qty-input').value = quantity;
        }

        async function addToCart() {
            const user = await Auth.getUser();
            if (!user) {
                Utils.showToast('Please login to add items to cart', 'error');
                window.location.href = 'login.html';
                return;
            }

            if (!selectedColor) {
                Utils.showToast('Please select a color', 'error');
                return;
            }

            try {
                await API.addToCart(product.id, selectedColor.id, quantity);
                Utils.showToast('Added to cart!', 'success');

                // Update cart count
                const cart = await API.getCart();
                const count = cart.reduce((sum, item) => sum + item.quantity, 0);
                const badge = document.getElementById('cart-count');
                if (badge) {
                    badge.textContent = count;
                    badge.classList.remove('hidden');
                }
            } catch (error) {
                Utils.showToast(error.message || 'Failed to add to cart', 'error');
            }
        }

        async function addToWishlist() {
            const user = await Auth.getUser();
            if (!user) {
                Utils.showToast('Please login first', 'error');
                window.location.href = 'login.html';
                return;
            }

            try {
                await API.addToWishlist(product.id);
                Utils.showToast('Added to wishlist!', 'success');
            } catch (error) {
                Utils.showToast(error.message || 'Failed to add to wishlist', 'error');
            }
        }
    </script>

    <style>
        .product-detail-section {
            padding: calc(72px + var(--space-8)) 0 var(--space-16);
        }

        .breadcrumb {
            color: var(--color-text-muted);
            font-size: var(--text-sm);
        }

        .breadcrumb a {
            color: var(--color-text-muted);
        }

        .breadcrumb a:hover {
            color: var(--color-accent);
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-12);
        }

        .main-image {
            border-radius: var(--radius-xl);
            overflow: hidden;
            background: var(--color-surface);
        }

        .main-image img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .thumbnail-grid {
            display: flex;
            gap: var(--space-3);
            margin-top: var(--space-4);
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all var(--transition-fast);
            background: none;
            padding: 0;
        }

        .thumbnail.active,
        .thumbnail:hover {
            border-color: var(--color-accent);
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-brand {
            font-size: var(--text-sm);
            text-transform: uppercase;
            letter-spacing: var(--tracking-wider);
            color: var(--color-accent);
            margin-bottom: var(--space-2);
            display: block;
        }

        .product-title {
            font-size: var(--text-3xl);
            margin-bottom: var(--space-3);
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
            color: var(--color-accent);
        }

        .rating-text {
            color: var(--color-text-muted);
            font-size: var(--text-sm);
        }

        .product-price {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-6);
        }

        .current-price {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--color-accent);
        }

        .original-price {
            font-size: var(--text-lg);
            color: var(--color-text-muted);
            text-decoration: line-through;
        }

        .product-description {
            color: var(--color-text-light);
            line-height: var(--leading-relaxed);
            margin-bottom: var(--space-6);
        }

        .product-option {
            margin-bottom: var(--space-6);
        }

        .product-option label {
            display: block;
            font-size: var(--text-sm);
            color: var(--color-text-muted);
            margin-bottom: var(--space-2);
        }

        .color-options {
            display: flex;
            gap: var(--space-2);
        }

        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .color-btn.active,
        .color-btn:hover {
            border-color: var(--color-accent);
            transform: scale(1.1);
        }

        .quantity-selector {
            display: inline-flex;
            align-items: center;
            background: var(--color-surface);
            border-radius: var(--radius-md);
            margin-right: var(--space-4);
        }

        .qty-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: none;
            color: var(--color-text);
            font-size: var(--text-lg);
            cursor: pointer;
            transition: color var(--transition-fast);
        }

        .qty-btn:hover:not(:disabled) {
            color: var(--color-accent);
        }

        .qty-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .qty-input {
            width: 50px;
            text-align: center;
            border: none;
            background: none;
            color: var(--color-text);
            font-size: var(--text-base);
        }

        .stock-info {
            font-size: var(--text-sm);
            color: var(--color-success);
        }

        .stock-info.low {
            color: var(--color-warning);
        }

        .stock-info.out {
            color: var(--color-error);
        }

        .product-actions {
            display: flex;
            gap: var(--space-3);
            margin-bottom: var(--space-6);
        }

        .product-meta {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
            margin-bottom: var(--space-2);
        }

        .product-meta a {
            color: var(--color-accent);
        }

        .specs-table {
            width: 100%;
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .specs-table td {
            padding: var(--space-4);
            border-bottom: 1px solid var(--glass-border);
        }

        .specs-table td:first-child {
            font-weight: var(--font-medium);
            width: 200px;
            background: var(--color-surface-light);
        }

        @media (max-width: 768px) {
            .product-detail {
                grid-template-columns: 1fr;
            }
        }
    </style>
</body>

</html>
